<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shrapnel City asset explorer</title>
<style>
  :root {
    --bg: #071111; --panel: #0e1d1e; --line: #1f3a3c; --ink: #cfe7e6; --muted: #6f9796; --accent: #4fe0c8; --warm: #ffb547;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header.top { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
    padding: 10px 16px; background: rgba(7, 17, 17, .94); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
  header.top h1 { margin: 0; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  header.top h1 a { color: inherit; text-decoration: none; }
  #tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  #tabs button, .tools button, .ctl button, #i-labels button {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  #tabs button.on { background: var(--accent); color: #032; border-color: var(--accent); font-weight: 600; }
  #tabs button:hover:not(.on), .tools button:hover, .ctl button:hover { border-color: var(--accent); }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
  .tools input[type=search], .tools select { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
  .tools label { color: var(--muted); display: flex; align-items: center; gap: 4px; }
  #status { color: var(--muted); font-size: 12px; padding: 6px 16px 0; }
  main { padding: 4px 16px 40px; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--warm); margin: 22px 0 10px; font-weight: 600; }
  section h2 small { margin-left: 10px; text-transform: none; letter-spacing: 0; color: var(--muted); font-weight: 400; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; cursor: pointer; max-width: 100%; }
  .card:hover { border-color: var(--accent); }
  .card.wide { min-width: 300px; }
  .card header { padding: 6px 2px 0; }
  .card h3 { margin: 0; font-size: 13px; }
  .card .sub { margin: 1px 0 0; color: var(--muted); font-size: 11px; max-width: 760px; overflow-wrap: anywhere; }
  .stages { display: flex; flex-wrap: wrap; gap: 6px; }
  figure.stage { margin: 0; }
  figure.stage canvas { display: block; border-radius: 4px; max-width: 100%; }
  figure.stage figcaption { font-size: 10px; color: var(--muted); text-align: center; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
  figure.missing div { display: grid; place-items: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 4px; font-size: 11px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 8px; margin: 6px 2px 0; font-size: 11px; max-width: 420px; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .card:not(.wide) dl { max-width: 150px; }
  .tags { display: flex; gap: 4px; margin-top: 4px; }
  .tag { font-size: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 0 6px; color: var(--muted); }
  [hidden] { display: none !important; }

  dialog#inspector { width: min(1100px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); color: var(--ink); }
  dialog::backdrop { background: rgba(0, 0, 0, .7); }
  .ins { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 0; max-height: calc(100vh - 34px); }
  .ins .left { padding: 12px; min-width: 0; }
  .ins .right { border-left: 1px solid var(--line); padding: 12px; overflow: auto; font-size: 12px; }
  .ins h3 { margin: 0; font-size: 16px; }
  .ins .sub { color: var(--muted); margin: 2px 0 8px; font-size: 12px; }
  #i-canvas { width: 100%; height: min(520px, 60vh); display: block; border-radius: 6px; cursor: grab; touch-action: none; }
  .ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
  .ctl input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent); }
  #i-frameno { font-variant-numeric: tabular-nums; min-width: 64px; color: var(--muted); }
  #i-labels { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  #i-labels button { font-size: 11px; padding: 2px 8px; }
  #i-close { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--muted); font-size: 20px; cursor: pointer; }
  .right h4 { margin: 12px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--warm); }
  .right h4:first-child { margin-top: 0; }
  #i-info div { padding: 1px 0; overflow-wrap: anywhere; }
  #i-info b { color: var(--muted); font-weight: 400; }
  #i-kids { margin: 0; padding-left: 0; list-style: none; font-family: ui-monospace, monospace; font-size: 11px; }
  #i-kids a { color: var(--accent); text-decoration: none; }
  #i-kids small { color: var(--muted); }
  pre { margin: 2px 0 6px; padding: 6px; background: #061010; border-radius: 4px; white-space: pre-wrap; font-size: 11px; max-height: 240px; overflow: auto; }
  summary { cursor: pointer; color: var(--muted); }
  summary.cur { color: var(--accent); }
  .muted { color: var(--muted); }
  @media (max-width: 760px) {
    .ins { grid-template-columns: 1fr; overflow: auto; }
    .ins .right { border-left: 0; border-top: 1px solid var(--line); }
    .tools { margin-left: 0; }
  }
</style>
</head>
<body>
<header class="top">
  <h1><a href="../">Shrapnel City</a> · assets</h1>
  <nav id="tabs"></nav>
  <div class="tools">
    <input id="search" type="search" placeholder="Filter…" aria-label="Filter">
    <select id="bg" aria-label="Background">
      <option value="dark">Dark</option>
      <option value="game">Game colour</option>
      <option value="checker">Checker</option>
      <option value="light">Light</option>
    </select>
    <label title="Levels tab: the level_mc collision map the game draws into a BitmapData and then removes"><input id="collision" type="checkbox"> collision map</label>
    <label title="Levels tab: enemy line-of-sight zones (hidden in game)"><input id="vision" type="checkbox"> vision zones</label>
    <button id="pause">Pause all</button>
  </div>
</header>
<div id="status">loading…</div>
<main id="main"></main>

<dialog id="inspector">
  <button id="i-close" aria-label="Close">×</button>
  <div class="ins">
    <div class="left">
      <h3 id="i-title"></h3>
      <div class="sub" id="i-sub"></div>
      <canvas id="i-canvas"></canvas>
      <div class="ctl">
        <button id="i-prev" title="Previous frame (←)">◀︎</button>
        <button id="i-play" title="Play / pause (space)">▶</button>
        <button id="i-next" title="Next frame (→)">▶︎</button>
        <input id="i-frame" type="range" min="1" max="1" value="1" aria-label="Frame">
        <span id="i-frameno"></span>
      </div>
      <div class="ctl">
        <label>zoom <input id="i-zoom" type="range" min="0" max="7" step="1" value="0" aria-label="Zoom"></label>
        <label><input id="i-bounds" type="checkbox" checked> bounds and origin</label>
        <span class="muted">drag to pan</span>
      </div>
      <div id="i-labels"></div>
    </div>
    <div class="right">
      <h4>Symbol</h4>
      <div id="i-info"></div>
      <h4>Children this frame</h4>
      <ul id="i-kids"></ul>
      <h4>Scripts</h4>
      <div id="i-script"></div>
    </div>
  </div>
</dialog>
<script type="module" src="explorer.js"></script>
</body>
</html>
