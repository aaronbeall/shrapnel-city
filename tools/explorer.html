<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shrapnel City asset explorer</title>
<style>
  :root {
    --bg: #071111; --panel: #0e1d1e; --line: #1f3a3c; --ink: #cfe7e6; --muted: #6f9796; --accent: #4fe0c8; --warm: #ffb547;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header.top { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
    padding: 10px 16px; background: rgba(7, 17, 17, .94); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
  header.top h1 { margin: 0; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
  header.top h1 a { color: inherit; text-decoration: none; }
  #tabs { display: flex; flex-wrap: wrap; gap: 4px; }
  #tabs button, .tools button, .ctl button {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  #tabs button.on { background: var(--accent); color: #032; border-color: var(--accent); font-weight: 600; }
  #tabs button:hover:not(.on), .tools button:hover, .ctl button:hover { border-color: var(--accent); }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }
  .tools input[type=search], .tools select { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
  .tools label { color: var(--muted); display: flex; align-items: center; gap: 4px; }
  #status { color: var(--muted); font-size: 12px; padding: 6px 16px 0; }
  main { padding: 4px 16px 40px; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--warm); margin: 22px 0 10px; font-weight: 600; }
  section h2 small { margin-left: 10px; text-transform: none; letter-spacing: 0; color: var(--muted); font-weight: 400; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; cursor: pointer; max-width: 100%; }
  .card:hover { border-color: var(--accent); }
  .card.wide { min-width: 300px; }
  .card header { padding: 6px 2px 0; }
  .card h3 { margin: 0; font-size: 13px; }
  .card .sub { margin: 1px 0 0; color: var(--muted); font-size: 11px; max-width: 760px; overflow-wrap: anywhere; }
  .stages { display: flex; flex-wrap: wrap; gap: 6px; }
  figure.stage { margin: 0; }
  figure.stage canvas { display: block; border-radius: 4px; max-width: 100%; }
  figure.stage figcaption { font-size: 10px; color: var(--muted); text-align: center; text-transform: uppercase; letter-spacing: .06em; padding-top: 2px; }
  figure.missing div { display: grid; place-items: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 4px; font-size: 11px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 8px; margin: 6px 2px 0; font-size: 11px; max-width: 420px; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .card:not(.wide) dl { max-width: 150px; }
  .tags { display: flex; gap: 4px; margin-top: 4px; }
  .tag { font-size: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 0 6px; color: var(--muted); }
  [hidden] { display: none !important; }

  dialog#inspector { width: min(1100px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 1px solid var(--line); border-radius: 10px;
    background: var(--panel); color: var(--ink); }
  dialog::backdrop { background: rgba(0, 0, 0, .7); }
  .ins { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 0; max-height: calc(100vh - 34px); }
  .ins .left { padding: 12px; min-width: 0; }
  .ins .right { border-left: 1px solid var(--line); padding: 12px; overflow: auto; font-size: 12px; }
  .ins h3 { margin: 0; font-size: 16px; }
  .ins .sub { color: var(--muted); margin: 2px 0 8px; font-size: 12px; }
  #i-canvas { width: 100%; height: min(520px, 60vh); display: block; border-radius: 6px; cursor: grab; touch-action: none; }
  .ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
  .ctl input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent); }
  #i-frameno { font-variant-numeric: tabular-nums; min-width: 64px; color: var(--muted); }
  .tl { margin-top: 8px; }
  .tl-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; font-size: 12px; min-height: 18px; }
  .tl-head b { font-variant-numeric: tabular-nums; }
  .curlabel { color: var(--warm); font-weight: 600; }
  .strip { --cw: 14px; position: relative; overflow-x: auto; overflow-y: hidden; margin-top: 4px; padding-bottom: 2px; background: #061010; border: 1px solid var(--line); border-radius: 6px; }
  .srow { position: relative; width: var(--w); min-width: 100%; }
  .srow.labels { height: 20px; border-bottom: 1px solid var(--line); }
  .flag { position: absolute; top: 2px; height: 16px; padding: 0 4px; border: 0; border-left: 2px solid var(--warm); border-radius: 0; background: rgba(255,181,71,.12);
    color: var(--warm); font: 600 10px/16px system-ui, sans-serif; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .flag:hover { background: rgba(255,181,71,.25); }
  .srow.cells { display: flex; height: 26px; cursor: pointer; touch-action: none; }
  .cell { position: relative; flex: none; width: var(--cw); border-right: 1px solid rgba(111,151,150,.18); }
  .cell:nth-child(5n) { background: rgba(111,151,150,.08); }
  .cell.tw::after { content: ""; position: absolute; left: 1px; right: 1px; bottom: 6px; height: 2px; background: rgba(79,224,200,.45); }
  .cell.key::after { content: ""; position: absolute; left: 50%; bottom: 4px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--ink); }
  .cell.sc::before { content: "a"; position: absolute; top: 1px; left: 0; right: 0; text-align: center; font: 9px/10px ui-monospace, monospace; color: #ff9c5b; }
  .cell.lb { border-left: 2px solid var(--warm); }
  .cell.cur { background: rgba(255,80,80,.35) !important; box-shadow: inset 0 0 0 1px #ff5a5a; }
  .srow.nums { height: 14px; font-size: 9px; color: var(--muted); }
  .srow.nums span { position: absolute; top: 0; padding-left: 2px; font-variant-numeric: tabular-nums; }
  .transport button { min-width: 34px; }
  .transport button.play { min-width: 48px; background: var(--accent); color: #032; border-color: var(--accent); font-weight: 700; }
  .transport button:disabled { opacity: .35; cursor: default; }
  .transport select { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; }
  .legend { font-size: 11px; display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .legend i { display: inline-block; font-style: normal; }
  .legend .lk { width: 6px; height: 6px; border-radius: 50%; background: var(--ink); margin-left: 6px; }
  .legend .lt { width: 10px; height: 2px; background: rgba(79,224,200,.6); margin-left: 6px; }
  .legend .ls { color: #ff9c5b; font: 10px ui-monospace, monospace; margin-left: 6px; }
  #i-close { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--muted); font-size: 20px; cursor: pointer; }
  .right h4 { margin: 12px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--warm); }
  .right h4:first-child { margin-top: 0; }
  #i-info div { padding: 1px 0; overflow-wrap: anywhere; }
  #i-info b { color: var(--muted); font-weight: 400; }
  #i-kids { margin: 0; padding-left: 0; list-style: none; font-family: ui-monospace, monospace; font-size: 11px; }
  #i-kids a { color: var(--accent); text-decoration: none; }
  #i-kids small { color: var(--muted); }
  pre { margin: 2px 0 6px; padding: 6px; background: #061010; border-radius: 4px; white-space: pre-wrap; font-size: 11px; max-height: 240px; overflow: auto; }
  summary { cursor: pointer; color: var(--muted); }
  summary.cur { color: var(--accent); }
  .muted { color: var(--muted); }
  .playbar { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .tools .playbar button { border: 0; border-radius: 0; padding: 5px 9px; display: inline-flex; gap: 1px; align-items: center; background: var(--panel); }
  .tools .playbar button + button { border-left: 1px solid var(--line); }
  .playbar svg { width: 14px; height: 14px; }
  .tools .playbar button.on { background: var(--accent); color: #032; }
  .kicon { display: inline-flex; width: 14px; height: 14px; vertical-align: -2px; flex: none; }
  .kicon svg { width: 100%; height: 100%; }
  .kind { white-space: nowrap; }
  h3 .kicon { margin-right: 2px; }
  dialog#help { width: min(680px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 16px 20px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); }
  #help h3 { margin: 0 0 4px; font-size: 16px; }
  #help h4 { margin: 16px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--warm); }
  #help .hclose { position: absolute; top: 8px; right: 10px; background: none; border: 0; color: var(--muted); font-size: 20px; cursor: pointer; }
  dl.kinds { display: grid; grid-template-columns: 150px 1fr; gap: 6px 12px; margin: 0; max-width: none; font-size: 12px; }
  dl.kinds dt { color: var(--ink); font-weight: 600; white-space: nowrap; }
  #help-btn { font-weight: 700; width: 30px; padding: 5px 0; }
  @media (max-width: 520px) { dl.kinds { grid-template-columns: 1fr; } dl.kinds dd { margin-bottom: 6px; } }
  #i-file .path { font-family: ui-monospace, monospace; font-size: 11px; overflow-wrap: anywhere; }
  #i-file a, .pieces, .crumbs a, .tree a { color: var(--accent); text-decoration: none; }
  #i-file a:hover, .pieces:hover, .crumbs a:hover, .tree a:hover { text-decoration: underline; }
  img.thumb { display: block; max-width: 100%; max-height: 100px; border-radius: 4px; background: #0b1717; image-rendering: pixelated; }
  #i-file img.thumb { max-height: 240px; }

  .fs { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 16px; align-items: start; padding-top: 12px; }
  .fs aside { position: sticky; top: 60px; max-height: calc(100vh - 76px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 6px; }
  .tree { font-size: 12px; }
  .tree details > :not(summary), .tree details > .leaf { margin-left: 14px; }
  .tree summary, .tree .leaf { padding: 1px 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tree .leaf { padding-left: 16px; }
  .tree small { color: var(--muted); }
  .tree a.cur { color: #032; background: var(--accent); border-radius: 3px; padding: 0 4px; font-weight: 600; }
  .crumbs { font-size: 14px; margin: 0 0 12px; overflow-wrap: anywhere; }
  .crumbs a:last-child { color: var(--warm); }
  .folders { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  a.folder { display: flex; flex-direction: column; min-width: 140px; max-width: 220px; padding: 8px 10px; color: var(--ink); text-decoration: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  a.folder:hover { border-color: var(--accent); }
  a.folder b { font-weight: 600; overflow-wrap: anywhere; }
  a.folder small { color: var(--muted); }
  .card.file h3 { font-size: 12px; overflow-wrap: anywhere; }
  .card.file dl { grid-template-columns: auto 1fr; }
  .pieces { display: block; font-size: 11px; margin: 4px 2px 0; }
  .fbar { display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end; margin-bottom: 8px; color: var(--muted); font-size: 12px; }
  .fbar input, .fbar select { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; font: inherit; }
  section h2 a.hlink { color: var(--accent); text-decoration: none; }
  .fcontent .clear { margin-left: 10px; font-size: 12px; color: var(--accent); }
  button.more { margin-top: 14px; background: var(--panel); color: var(--accent); border: 1px solid var(--line); border-radius: 6px; padding: 6px 14px; font: inherit; cursor: pointer; }
  .fcontent h2 { font-size: 13px; color: var(--warm); margin: 0 0 10px; }
  .fcontent h2 small { margin-left: 10px; color: var(--muted); font-weight: 400; }
  @media (max-width: 760px) {
    .ins { grid-template-columns: 1fr; overflow: auto; }
    .ins .right { border-left: 0; border-top: 1px solid var(--line); }
    .tools { margin-left: 0; }
    .fs { grid-template-columns: 1fr; }
    .fs aside { position: static; max-height: 40vh; }
  }
</style>
</head>
<body>
<header class="top">
  <h1><a href="../">Shrapnel City</a> · assets</h1>
  <nav id="tabs"></nav>
  <div class="tools">
    <input id="search" type="search" placeholder="Filter…" aria-label="Filter">
    <select id="bg" aria-label="Background">
      <option value="dark">Dark</option>
      <option value="game">Game colour</option>
      <option value="checker">Checker</option>
      <option value="light">Light</option>
    </select>
    <div class="playbar" role="group" aria-label="Playback for all previews">
      <button id="pb-stop" title="Stop: every preview on frame 1" aria-label="Stop"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1" fill="currentColor"/></svg></button>
      <button id="pb-loop" title="Play, looping" aria-label="Play looping"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13 8a5 5 0 1 1-1.6-3.7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M13.4 1.8v3.6H9.8z" fill="currentColor"/><path d="M6.5 5.6v4.8L10.3 8z" fill="currentColor"/></svg></button>
      <button id="pb-once" title="Play once, then stop on the last frame" aria-label="Play once"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 3.5v9l7-4.5z" fill="currentColor"/><rect x="11" y="3.5" width="1.8" height="9" fill="currentColor"/></svg></button>
    </div>
    <button id="help-btn" title="What the kinds mean" aria-label="Help">?</button>
  </div>
</header>
<div id="status">loading…</div>
<main id="main"></main>

<dialog id="help">
  <button class="hclose" aria-label="Close">×</button>
  <h3>Kinds</h3>
  <p class="muted">Every file in source/ and levels/ is one of these. A library symbol has a name other symbols place it by; pieces only exist inside the symbol whose folder holds them.</p>
  <div class="hbody"></div>
</dialog>

<dialog id="inspector">
  <button id="i-close" aria-label="Close">×</button>
  <div class="ins">
    <div class="left">
      <h3 id="i-title"></h3>
      <div class="sub" id="i-sub"></div>
      <canvas id="i-canvas"></canvas>
      <div class="tl">
        <div class="tl-head"><b id="i-frameno"></b> <span id="i-curlabel" class="curlabel"></span> <span id="i-tlnote" class="muted"></span></div>
        <div id="i-strip" class="strip" title="Click or drag to pick a frame"></div>
        <div class="ctl transport">
          <button id="i-first" title="First frame (Home)" aria-label="First frame">⏮</button>
          <button id="i-prev" title="Previous frame (←)" aria-label="Previous frame">◀︎</button>
          <button id="i-play" class="play" title="Play / pause (space)" aria-label="Play or pause">▶</button>
          <button id="i-next" title="Next frame (→)" aria-label="Next frame">▶︎</button>
          <button id="i-last" title="Last frame (End)" aria-label="Last frame">⏭</button>
          <select id="i-loop" aria-label="Loop"></select>
          <select id="i-speed" aria-label="Speed"><option value="0.25">¼ speed</option><option value="0.5">½ speed</option><option value="1" selected>1× (31 fps)</option><option value="2">2×</option></select>
          <span class="legend muted"><i class="lk"></i> keyframe <i class="lt"></i> tween <i class="ls">a</i> script</span>
        </div>
      </div>
      <div class="ctl">
        <label>zoom <input id="i-zoom" type="range" min="0" max="7" step="1" value="0" aria-label="Zoom"></label>
        <label><input id="i-bounds" type="checkbox" checked> bounds and origin</label>
        <span class="muted">drag to pan</span>
      </div>
    </div>
    <div class="right">
      <h4>Symbol</h4>
      <div id="i-info"></div>
      <h4 id="i-file-h">Source file</h4>
      <div id="i-file"></div>
      <h4>Children this frame</h4>
      <ul id="i-kids"></ul>
      <h4>Scripts</h4>
      <div id="i-script"></div>
    </div>
  </div>
</dialog>
<script type="module" src="explorer.js"></script>
</body>
</html>
